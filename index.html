<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻將雲端記帳本</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        h2, h3 {
            text-align: center;
            color: #2c3e50;
        }

        h4 {
            color: #2c3e50;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* 8選4 玩家選擇 */
        .player-select-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 5px;
        }

        .select-player-btn {
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            background-color: #ecf0f1;
            color: #2c3e50;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-player-btn.active {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }

        /* 玩家積分輸入 */
        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .input-row span {
            font-weight: bold;
            min-width: 50px;
        }

        /* 贏輸按鈕 */
        .type-toggle-btn {
            width: 45px;
            height: 42px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            cursor: pointer;
            background-color: #ecf0f1;
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0;
        }

        .type-toggle-btn.win {
            background-color: #27ae60;
            color: white;
            border-color: #1e8449;
        }

        .type-toggle-btn.lose {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

        .action-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        .action-btn:hover {
            background-color: #1a252f;
        }

        /* 排行榜 */
        .rank-list {
            list-style-type: none;
            padding: 0;
            margin-top: 10px;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: #fdfefe;
            border: 1px solid #d6dbdf;
            border-radius: 6px;
            font-weight: bold;
        }

        .rank-item.top-1 {
            background: #fcf3cf;
            border-color: #f7dc6f;
        }

        /* 歷史紀錄 */
        .history-container {
            max-height: 350px;
            overflow-y: auto;
        }

        .date-group {
            margin-bottom: 15px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
        }

        .date-header {
            background: #edf2f7;
            padding: 8px 12px;
            font-weight: bold;
            color: #2d3748;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        ul.date-records {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        ul.date-records li {
            padding: 10px 12px;
            border-bottom: 1px solid #edf2f7;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        ul.date-records li:last-child {
            border-bottom: none;
        }

        ul.date-records li .record-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-time {
            font-size: 12px;
            color: #a0aec0;
        }

        /* 每局捐款區塊 */
        .game-donation-inputs {
            display: flex;
            gap: 10px;
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px dashed #cbd5e0;
            font-size: 13px;
            align-items: center;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .donation-person {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .game-donation-inputs select {
            padding: 5px 8px;
            font-size: 13px;
            width: 105px;
            background: white;
        }

        /* 寄生 */
        .parasite-section {
            width: 100%;
            border-top: 1px solid #e2e8f0;
            margin-top: 4px;
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .parasite-title {
            font-weight: bold;
            color: #4a5568;
        }

        .parasite-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .parasite-row select {
            width: 105px;
        }

        .parasite-donation-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .record-action-row {
            width: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* 確認按鈕 */
        .small-confirm-btn {
            padding: 5px 14px;
            font-size: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
            font-weight: bold;
        }

        .small-confirm-btn:hover {
            background-color: #1e8449;
        }

        /* 刪除按鈕 */
        .small-delete-btn {
            padding: 5px 10px;
            font-size: 12px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
        }

        .small-delete-btn:hover {
            background-color: #c0392b;
        }

        /* 離場費 */
        .exit-fee-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 12px;
            border: 1px dashed #cbd5e0;
            border-radius: 6px;
        }

        .exit-fee-controls select {
            flex: 1;
            min-width: 180px;
        }

        .exit-fee-note {
            font-size: 13px;
            color: #718096;
            margin-top: 8px;
        }

        .exit-fee-history {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }

        .exit-fee-history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            border-bottom: 1px solid #edf2f7;
            gap: 10px;
        }

        .exit-fee-history-item:last-child {
            border-bottom: none;
        }

        .exit-fee-player {
            font-weight: bold;
            color: #2d3748;
        }

        .exit-fee-amount {
            color: #d35400;
            font-weight: bold;
        }

        .exit-fee-time {
            color: #a0aec0;
            font-size: 12px;
        }

        .exit-clear-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        .exit-clear-btn:hover {
            background-color: #c0392b;
        }

        /* 總金額 */
        .grand-total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: #f8fafc;
            border: 2px solid #27ae60;
            border-radius: 8px;
            font-weight: bold;
        }

        .grand-total-label {
            font-size: 18px;
            color: #2c3e50;
        }

        .grand-total-amount {
            font-size: 26px;
            color: #27ae60;
            font-weight: bold;
        }

        .grand-total-note {
            text-align: center;
            font-size: 13px;
            color: #718096;
            margin-top: 10px;
        }

        /* 總將數 */
        .total-game-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            margin-top: 15px;
            background: #f8fafc;
            border: 2px solid #3498db;
            border-radius: 8px;
            font-weight: bold;
        }

        .total-game-label {
            font-size: 18px;
            color: #2c3e50;
        }

        .total-game-count {
            font-size: 26px;
            color: #2980b9;
            font-weight: bold;
        }
    </style>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            setDoc,
            getDocs,
            deleteDoc,
            doc,
            onSnapshot,
            query,
            orderBy
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        const firebaseConfig = {
            apiKey: "AIzaSyDS9-ray-dSj_Y7IvrRjofEIWHjqFgu0Zg",
            authDomain: "mahjong-a2377.firebaseapp.com",
            projectId: "mahjong-a2377",
            storageBucket: "mahjong-a2377.firebasestorage.app",
            messagingSenderId: "892513192079",
            appId: "1:892513192079:web:ce033c110932cfbfc508fa",
            measurementId: "G-707G2B2DH3"
        };


        const app =
            initializeApp(firebaseConfig);

        const db =
            getFirestore(app);


        /* ===============================
           玩家名單
        =============================== */

        const allPlayers = [
            "大凸",
            "阿翔",
            "大姐",
            "鱷魚",
            "抖內姐",
            "黑人",
            "藍莓",
            "阿雯"
        ];


        let selectedPlayers = [
            "大凸",
            "阿翔",
            "大姐",
            "鱷魚"
        ];


        let playerStates = {

            "大凸": {
                type: "win",
                score: ""
            },

            "阿翔": {
                type: "win",
                score: ""
            },

            "大姐": {
                type: "win",
                score: ""
            },

            "鱷魚": {
                type: "win",
                score: ""
            }
        };


        /* ===============================
           總金額暫存
        =============================== */

        let currentDonationGrandTotal = 0;
        let currentExitFeeGrandTotal = 0;


        function updateGrandTotal() {

            const total =
                currentDonationGrandTotal +
                currentExitFeeGrandTotal;


            const amountEl =
                document.getElementById(
                    "grandTotalAmount"
                );


            const detailEl =
                document.getElementById(
                    "grandTotalDetail"
                );


            if (amountEl) {

                amountEl.textContent =
                    `$${total}`;
            }


            if (detailEl) {

                detailEl.textContent =
                    `捐款 $${currentDonationGrandTotal} ＋ 離場費 $${currentExitFeeGrandTotal}`;
            }
        }


        /* ===============================
           網頁載入
        =============================== */

        window.onload =
        function() {

            const today =
                new Date()
                    .toISOString()
                    .split("T")[0];


            document.getElementById(
                "gameDate"
            ).value =
                today;


            renderSelector();
            renderInputs();
            renderExitFeePlayerOptions();
            updateGrandTotal();
        };


        /* ===============================
           選擇玩家
        =============================== */

        window.togglePlayer =
        function(name) {

            selectedPlayers.forEach(

                p => {

                    const inputEl =
                        document.getElementById(
                            `amt_${p}`
                        );


                    if (
                        inputEl &&
                        playerStates[p]
                    ) {

                        playerStates[p].score =
                            inputEl.value;
                    }
                }
            );


            const index =
                selectedPlayers.indexOf(name);


            if (index > -1) {

                alert(
                    "一局必須剛好選擇 4 位玩家！如要更換，請直接點擊其他未選中的玩家來替換。"
                );

                return;
            }


            if (
                selectedPlayers.length >= 4
            ) {

                const removedPlayer =
                    selectedPlayers.shift();


                delete playerStates[
                    removedPlayer
                ];
            }


            selectedPlayers.push(name);


            playerStates[name] = {
                type: "win",
                score: ""
            };


            renderSelector();
            renderInputs();
        };


        /* ===============================
           玩家按鈕
        =============================== */

        function renderSelector() {

            const container =
                document.getElementById(
                    "playerSelectorContainer"
                );


            let html = "";


            allPlayers.forEach(

                p => {

                    const active =
                        selectedPlayers.includes(p)
                            ? "active"
                            : "";


                    html += `
                        <button
                            type="button"
                            class="select-player-btn ${active}"
                            onclick="togglePlayer('${p}')"
                        >
                            ${p}
                        </button>
                    `;
                }
            );


            container.innerHTML =
                html;
        }


        /* ===============================
           切換輸贏
        =============================== */

        window.toggleType =
        function(name) {

            const inputEl =
                document.getElementById(
                    `amt_${name}`
                );


            if (inputEl) {

                playerStates[name].score =
                    inputEl.value;
            }


            playerStates[name].type =
                playerStates[name].type === "win"
                    ? "lose"
                    : "win";


            renderInputs();
        };


        /* ===============================
           積分輸入
        =============================== */

        function renderInputs() {

            const container =
                document.getElementById(
                    "fourInputsContainer"
                );


            let html = "";


            selectedPlayers.forEach(

                name => {

                    const state =
                        playerStates[name];


                    const typeClass =
                        state.type === "win"
                            ? "win"
                            : "lose";


                    const typeText =
                        state.type === "win"
                            ? "贏"
                            : "輸";


                    const currentVal =
                        state.score !== undefined
                            ? state.score
                            : "";


                    html += `
                        <div class="input-row">

                            <span>
                                ${name}
                            </span>

                            <button
                                type="button"
                                class="type-toggle-btn ${typeClass}"
                                onclick="toggleType('${name}')"
                            >
                                ${typeText}
                            </button>

                            <input
                                type="number"
                                id="amt_${name}"
                                placeholder="輸入積分"
                                value="${currentVal}"
                                min="0"
                                oninput="updateScore('${name}', this.value)"
                                style="flex:1;"
                            >

                        </div>
                    `;
                }
            );


            container.innerHTML =
                html;
        }


        window.updateScore =
        function(name, val) {

            if (
                playerStates[name]
            ) {

                playerStates[name].score =
                    val;
            }
        };


        /* ===============================
           新增牌局
        =============================== */

        window.addRecord =
        async function() {

            const dateVal =
                document.getElementById(
                    "gameDate"
                ).value;


            if (!dateVal) {

                alert(
                    "請選擇打牌日期！"
                );

                return;
            }


            let totalSum = 0;
            let recordDetails = {};


            for (
                let name
                of selectedPlayers
            ) {

                const amtVal =
                    document.getElementById(
                        `amt_${name}`
                    ).value;


                const num =
                    parseFloat(
                        amtVal
                    );


                if (
                    isNaN(num) ||
                    num < 0
                ) {

                    alert(
                        `請為「${name}」輸入有效的積分！`
                    );

                    return;
                }


                const signedAmount =
                    playerStates[name].type ===
                    "win"
                        ? num
                        : -num;


                totalSum +=
                    signedAmount;


                recordDetails[name] =
                    signedAmount;
            }


            if (
                totalSum !== 0
            ) {

                alert(
`⚠️ 積分總和不為 0（目前計算總和為：${totalSum}）！

麻將積分總和必須剛好平衡
（贏的總積分要等於輸的總積分）

請重新檢查並輸入！`
                );

                return;
            }


            const now =
                new Date();


            const timeStr =
                `${String(
                    now.getHours()
                ).padStart(2, "0")}:${String(
                    now.getMinutes()
                ).padStart(2, "0")}`;


            try {

                await addDoc(

                    collection(
                        db,
                        "mahjong_records_v7"
                    ),

                    {
                        date:
                            dateVal,

                        time:
                            timeStr,

                        details:
                            recordDetails,

                        donation3:
                            0,

                        donation4:
                            0,

                        donation3Type:
                            "",

                        donation4Type:
                            "",

                        parasite3Name:
                            "",

                        parasite3Donation:
                            0,

                        parasite3Type:
                            "",

                        parasite4Name:
                            "",

                        parasite4Donation:
                            0,

                        parasite4Type:
                            "",

                        timestamp:
                            Date.now()
                    }
                );


                for (
                    let name
                    in playerStates
                ) {

                    playerStates[name].score =
                        "";
                }


                renderInputs();


                alert(
                    "儲存成功！"
                );

            } catch (e) {

                console.error(
                    "寫入錯誤：",
                    e
                );


                alert(
                    "儲存失敗，請檢查網路連線！"
                );
            }
        };


        /* ===============================
           寄生選擇
        =============================== */

        window.toggleParasiteDonation =
        function(docId, rank) {

            const nameSelect =
                document.getElementById(
                    `parasite${rank}_name_${docId}`
                );


            const donationWrap =
                document.getElementById(
                    `parasite${rank}_donation_wrap_${docId}`
                );


            const donationSelect =
                document.getElementById(
                    `parasite${rank}_amt_${docId}`
                );


            if (
                nameSelect.value !== ""
            ) {

                donationWrap.style.display =
                    "flex";

            } else {

                donationWrap.style.display =
                    "none";


                donationSelect.value =
                    "";
            }
        };


        /* ===============================
           儲存捐款＋寄生
        =============================== */

        window.saveDonation =
        async function(docId) {

            const select3 =
                document.getElementById(
                    `don3_amt_${docId}`
                );


            const select4 =
                document.getElementById(
                    `don4_amt_${docId}`
                );


            const choice3 =
                select3.value;


            const choice4 =
                select4.value;


            if (
                choice3 === "" ||
                choice4 === ""
            ) {

                alert(
                    "請選擇第三名與第四名的結果！"
                );

                return;
            }


            const amount3 =
                choice3 === "wash"
                    ? 0
                    : Number(choice3);


            const amount4 =
                choice4 === "wash"
                    ? 0
                    : Number(choice4);


            const type3 =
                choice3 === "wash"
                    ? "wash"
                    : "money";


            const type4 =
                choice4 === "wash"
                    ? "wash"
                    : "money";


            const parasite3Name =
                document.getElementById(
                    `parasite3_name_${docId}`
                ).value;


            const parasite3Select =
                document.getElementById(
                    `parasite3_amt_${docId}`
                );


            let parasite3Donation = 0;
            let parasite3Type = "";


            if (
                parasite3Name !== ""
            ) {

                const parasite3Choice =
                    parasite3Select.value;


                if (
                    parasite3Choice === ""
                ) {

                    alert(
                        "請選擇寄生第三名玩家的捐款結果！"
                    );

                    return;
                }


                parasite3Donation =
                    parasite3Choice === "wash"
                        ? 0
                        : Number(
                            parasite3Choice
                        );


                parasite3Type =
                    parasite3Choice === "wash"
                        ? "wash"
                        : "money";
            }


            const parasite4Name =
                document.getElementById(
                    `parasite4_name_${docId}`
                ).value;


            const parasite4Select =
                document.getElementById(
                    `parasite4_amt_${docId}`
                );


            let parasite4Donation = 0;
            let parasite4Type = "";


            if (
                parasite4Name !== ""
            ) {

                const parasite4Choice =
                    parasite4Select.value;


                if (
                    parasite4Choice === ""
                ) {

                    alert(
                        "請選擇寄生第四名玩家的捐款結果！"
                    );

                    return;
                }


                parasite4Donation =
                    parasite4Choice === "wash"
                        ? 0
                        : Number(
                            parasite4Choice
                        );


                parasite4Type =
                    parasite4Choice === "wash"
                        ? "wash"
                        : "money";
            }


            try {

                await setDoc(

                    doc(
                        db,
                        "mahjong_records_v7",
                        docId
                    ),

                    {
                        donation3:
                            amount3,

                        donation4:
                            amount4,

                        donation3Type:
                            type3,

                        donation4Type:
                            type4,

                        parasite3Name:
                            parasite3Name,

                        parasite3Donation:
                            parasite3Donation,

                        parasite3Type:
                            parasite3Type,

                        parasite4Name:
                            parasite4Name,

                        parasite4Donation:
                            parasite4Donation,

                        parasite4Type:
                            parasite4Type
                    },

                    {
                        merge:
                            true
                    }
                );


                alert(
                    "結果已儲存！"
                );

            } catch (e) {

                console.error(
                    "結果寫入錯誤：",
                    e

                                                >
                                                    50

                                                <option

                                                    ${selected3Hundred}
                                                >
                                                    100

                                                </option>

                                            <select

                                                    50

                                                            disabled

                                                        >

            const sortedDonationPlayers =

                    donationObj

                        b
                    ) =>

                        donationObj[b] -
                        donationObj[a]

                );


            let donationHTML =
                '<ul class="rank-list">';


            sortedDonationPlayers.forEach(

                name => {

                    donationHTML += `

                }
            );


            donationHTML +=
                "</ul>";


            donationSummaryEl.innerHTML =
                donationHTML;


            /* ===============================

            =============================== */

            const sortedWashPlayers =
                Object.keys(
                    washObj
                ).sort(

                    (
                        a,
                        b
                    ) => {

                        if (
                            washObj[b] !==
                            washObj[a]
                        ) {

                            return (
                                washObj[b] -
                                washObj[a]
                            );
                        }


                        return (
                            allPlayers.indexOf(a) -
                            allPlayers.indexOf(b)
                        );
                    }
                );


            let washHTML =
                '<ul class="rank-list">';


            sortedWashPlayers.forEach(

                (
                    name,
                    index
                ) => {

                    const washCount =
                        washObj[name];


                    const rankClass =
                        index === 0 &&
                        washCount > 0
                            ? "top-1"
                            : "";


                    washHTML += `

                        <li class="rank-item ${rankClass}">

                            <span>
                                ${medals[index]}
                                第 ${index + 1} 名：
                                ${name}
                            </span>

                            <span
                                style="
                                    color:#2980b9;
                                "
                            >
                                🍽️ ${washCount} 次
                            </span>

                        </li>
                    `;
                }
            );


            washHTML +=
                "</ul>";


            washRankEl.innerHTML =
                washHTML;
        }

    </script>
</head>


<body>

    <h2>
        🀄 麻將雲端記帳本

    <!-- 選擇日期與玩家 -->

    <div class="card">

        <h3>
            1. 選擇打牌日期與 4 位玩家

        <div class="form-group">

                type="date"
                id="gameDate"
            >

        </div>


        <div
            class="form-group"
            style="margin-top:15px;"
        >

            <label>
                8 選 4：選擇本局 4 位玩家
            </label>

            <p
                style="
                    font-size:12px;
                    color:#666;
                    margin-top:-3px;
                    margin-bottom:8px;
                "

            >
            </div>

        </div>

    </div>


    <!-- 輸入積分 -->

    <div class="card">

        </h3>

        <div
            id="fourInputsContainer"
        >
        </div>

            class="action-btn"
            onclick="addRecord()"

        </button>

    </div>


    <!-- 總積分 -->

    <div class="card">

        <h3>
            🏆 總積分排行榜
        </h3>

        <div
            id="rankContainer"
        >
        </div>

    </div>

            📈 平均分排行榜（總積分 ÷ 場次）

        </div>

        </div>

            💸 離場費捐款

                    請選擇玩家

                class="small-confirm-btn"

                確認
            </button>

        <div class="exit-fee-note">
            每次確認會替選擇的玩家新增一筆 50 元離場費。
        </div>


        <h4>
            💰 離場費累計

        <div
            id="exitFeeSummaryContainer"
