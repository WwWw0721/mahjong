<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麻將雲端記帳本</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:650px;margin:30px auto;padding:20px;background:#f4f7f6;color:#333}
h2,h3{text-align:center;color:#2c3e50}
h4{color:#2c3e50}
.card{background:white;padding:20px;border-radius:8px;box-shadow:0 2px 5px #0002;margin-bottom:20px}
label{display:block;margin-bottom:8px;font-weight:bold}
input,select,button{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:4px}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.player-select-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.select-player-btn{background:#ecf0f1;color:#2c3e50;border:2px solid #bdc3c7;font-weight:bold}
.select-player-btn.active{background:#3498db;color:white;border-color:#2980b9}
.input-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;background:#f9f9f9;padding:10px;border-radius:6px;border:1px solid #eee}
.input-row span{font-weight:bold;min-width:50px}
.input-row input{flex:1;min-width:0}
.type-toggle-btn{width:45px;flex-shrink:0;font-weight:bold;padding:10px 0}
.win{background:#27ae60;color:white}
.lose{background:#e74c3c;color:white}
.action-btn{background:#2c3e50;color:white;border:0;font-weight:bold;margin-top:5px}
.rank-list{list-style:none;padding:0}
.rank-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 15px;margin-bottom:8px;border:1px solid #d6dbdf;border-radius:6px;font-weight:bold}
.top-1{background:#fcf3cf;border-color:#f7dc6f}
.history-container{max-height:350px;overflow-y:auto}
.date-group{margin-bottom:15px;border:1px solid #e2e8f0;border-radius:6px;overflow:hidden}
.date-header{background:#edf2f7;padding:8px 12px;font-weight:bold}
.record{padding:12px;border-bottom:1px solid #edf2f7}
.record-main{display:flex;justify-content:space-between;gap:8px}
.record-time,.note{font-size:13px;color:#718096}
.scores{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.game-donation-inputs{background:#f8fafc;padding:10px;border:1px dashed #cbd5e0;border-radius:4px}
.donation-person,.parasite-row,.record-action-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.game-donation-inputs select{width:105px;padding:5px;font-size:13px}
.parasite-section{border-top:1px solid #e2e8f0;margin-top:10px;padding-top:8px}
.parasite-donation-wrap{display:flex;align-items:center;gap:6px}
.small-confirm-btn,.small-delete-btn,.small-edit-btn{width:auto;padding:6px 12px;font-size:13px;color:white;border:0}
.small-confirm-btn{background:#27ae60}
.small-delete-btn{background:#e74c3c;color:white}
.small-edit-btn{background:#2980b9}
.grand-total-box,.total-game-box{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:18px;border:2px solid #27ae60;border-radius:8px;font-weight:bold}
.grand-total-amount{font-size:26px;color:#27ae60}
.total-game-box{margin-top:15px;border-color:#3498db}
.total-game-count{font-size:26px;color:#2980b9}
dialog{width:calc(100% - 30px);max-width:520px;max-height:90vh;overflow:auto;border:0;border-radius:10px;padding:22px}
dialog::backdrop{background:#0007}
.edit-actions{display:flex;gap:10px;margin-top:15px}
.edit-actions button{flex:1}
#editMessage{color:#c0392b;white-space:pre-wrap}
.empty{text-align:center;color:#7f8c8d}
.positive{color:#27ae60}
.negative{color:#e74c3c}
.neutral{color:#7f8c8d}
</style>
</head>

<body>
<h2>🀄 麻將雲端記帳本</h2>

<div class="card">
  <h3>💰 公基金收支</h3>
  <button
    type="button"
    class="action-btn"
    onclick="location.href='./fund.html'"
  >
    查看捐款收入與支出
  </button>
</div>

<div class="card">
  <h3>👤 個人頁面</h3>
  <label for="profilePlayer">選擇要查看的玩家：</label>

  <select id="profilePlayer">
    <option value="大凸">大凸</option>
    <option value="阿翔">阿翔</option>
    <option value="大姐">大姐</option>
    <option value="鱷魚">鱷魚</option>
    <option value="抖內姐">抖內姐</option>
    <option value="黑人">黑人</option>
    <option value="藍莓">藍莓</option>
    <option value="阿雯">阿雯</option>
  </select>

  <button
    type="button"
    class="action-btn"
    style="margin-top:12px"
    onclick="location.href='./player.html?player='+encodeURIComponent(document.getElementById('profilePlayer').value)"
  >
    查看個人數據
  </button>
</div>

<div class="card" id="entryCard">
  <h3>1. 選擇打牌日期與 4 位玩家</h3>

  <label for="gameDate">選擇日期：</label>
  <input type="date" id="gameDate">

  <label style="margin-top:15px">8 選 4：選擇本局 4 位玩家</label>
  <p class="note">直接點擊未選中的人，即可自動替換！</p>

  <div class="player-select-grid" id="playerSelectorContainer"></div>

  <h3>2. 輸入各家積分</h3>
  <div id="fourInputsContainer"></div>

  <button class="action-btn" id="addButton" onclick="addRecord()">
    確認無誤並儲存記錄
  </button>
</div>

<div class="card">
  <h3>🏆 總積分排行榜</h3>
  <div id="rankContainer"></div>
</div>

<div class="card">
  <h3>📈 平均分排行榜（總積分 ÷ 場次）</h3>
  <div id="avgRankContainer"></div>
</div>

<div class="card">
  <h3>🔥 單將最高積分前三筆</h3>
  <div id="topGameScoreContainer"></div>
</div>

<div class="card">
  <h3>🥶 單將最低積分前三筆</h3>
  <div id="bottomGameScoreContainer"></div>
</div>

<div class="card">
  <h3>📜 歷史明細（依日期與將次區分）</h3>
  <div class="history-container" id="recordList">載入中…</div>
</div>

<div class="card">
  <h3>🎁 捐款結果總計</h3>
  <div id="donationSummaryContainer"></div>
</div>

<div class="card">
  <h3>💸 平均一將捐款排行榜</h3>

  <p class="note">
    （本人捐款＋寄生捐款）÷ 個人參與將數，越低越前面。
    未參與牌局者不列名次，放在最後。
  </p>

  <div id="avgDonationRankContainer"></div>
</div>

<div class="card">
  <h3>🍽️ 洗碗排行榜</h3>
  <div id="washRankContainer"></div>
</div>

<div class="card">
  <h3>💰 總金額（捐款）</h3>

  <div class="grand-total-box">
    <span>目前總金額</span>
    <span class="grand-total-amount" id="grandTotalAmount">$0</span>
  </div>

  <p class="note" id="grandTotalDetail" style="text-align:center"></p>

  <div class="total-game-box">
    <span>🎲 總將數</span>
    <span class="total-game-count" id="totalGameCount">0 將</span>
  </div>
</div>

<dialog id="editDialog" aria-labelledby="editTitle">
  <h3 id="editTitle">✏️ 修改牌局積分</h3>
  <p class="note" id="editInfo"></p>
  <p class="note">點擊「贏／輸」切換，四人積分總和必須為 0。</p>

  <div id="editInputs"></div>
  <p id="editMessage" role="status"></p>

  <div class="edit-actions">
    <button onclick="closeEditor()">取消</button>

    <button
      class="small-confirm-btn"
      onclick="saveEdit()"
      id="editSaveButton"
    >
      儲存修改
    </button>
  </div>
</dialog>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot,
  query,
  orderBy,
  runTransaction
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9-ray-dSj_Y7IvrRjofEIWHjqFgu0Zg",
  authDomain: "mahjong-a2377.firebaseapp.com",
  projectId: "mahjong-a2377",
  storageBucket: "mahjong-a2377.firebasestorage.app",
  messagingSenderId: "892513192079",
  appId: "1:892513192079:web:ce033c110932cfbfc508fa",
  measurementId: "G-707G2B2DH3"
};

const db = getFirestore(initializeApp(firebaseConfig));
const RECORDS = "mahjong_records_v7";

const allPlayers = [
  "大凸", "阿翔", "大姐", "鱷魚",
  "抖內姐", "黑人", "藍莓", "阿雯"
];

let selectedPlayers = allPlayers.slice(0, 4);

let playerStates = Object.fromEntries(
  selectedPlayers.map(player => [
    player,
    { type: "win", score: "" }
  ])
);

let records = [];
let donationTotal = 0;
let editState = null;

const pending = new Set();
const $ = id => document.getElementById(id);

const esc = value => String(value ?? "").replace(
  /[&<>"']/g,
  c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c])
);

const rank = details =>
  Object.keys(details).sort((a, b) => details[b] - details[a]);

const signature = details => JSON.stringify(
  Object.entries(details).sort(([a], [b]) => a.localeCompare(b))
);

const signed = number => (number > 0 ? "+" : "") + number;

const color = number =>
  number > 0 ? "positive" : number < 0 ? "negative" : "neutral";

const zeros = () =>
  Object.fromEntries(allPlayers.map(player => [player, 0]));

function admin() {
  const password = prompt("請輸入管理者密碼：");

  if (password === null) return false;

  if (password !== "0721") {
    alert("密碼錯誤！");
    return false;
  }

  return true;
}

function lockControls(root, locked) {
  root.querySelectorAll("button,input,select").forEach(element => {
    element.disabled = locked;
  });
}

async function busy(key, button, job, root) {
  if (pending.has(key)) return;

  pending.add(key);

  const label = button?.textContent;
  const buttonId = button?.id;

  if (root) lockControls(root, true);

  if (button) {
    button.disabled = true;
    button.textContent = "處理中…";
  }

  try {
    await job();
  } catch (error) {
    console.error(error);
    alert(error.message || "操作失敗，請檢查網路連線！");
  } finally {
    pending.delete(key);

    if (root) lockControls(root, false);

    if (button) {
      button.disabled = false;
      button.textContent = label;
    }

    const current = buttonId ? $(buttonId) : null;

    if (current) {
      current.disabled = false;
      current.textContent = label;
    }
  }
}

function inputRows(names, states, editing = false) {
  return names.map((player, index) => {
    const state = states[player];

    const handler = editing
      ? `toggleEditType(${index})`
      : `toggleType(${index})`;

    return `
      <div class="input-row">
        <span>${esc(player)}</span>

        <button
          type="button"
          class="type-toggle-btn ${state.type}"
          onclick="${handler}"
        >
          ${state.type === "win" ? "贏" : "輸"}
        </button>

        <input
          aria-label="${esc(player)}積分"
          type="number"
          min="0"
          step="any"
          placeholder="輸入積分"
          value="${esc(state.score)}"
          oninput="${editing ? "updateEditScore" : "updateScore"}(${index},this.value)"
        >
      </div>
    `;
  }).join("");
}

function renderEntry() {
  $("playerSelectorContainer").innerHTML = allPlayers.map(
    (player, index) => `
      <button
        class="select-player-btn ${selectedPlayers.includes(player) ? "active" : ""}"
        onclick="togglePlayer(${index})"
      >
        ${esc(player)}
      </button>
    `
  ).join("");

  $("fourInputsContainer").innerHTML =
    inputRows(selectedPlayers, playerStates);
}

window.togglePlayer = index => {
  if (pending.has("add")) return;

  const player = allPlayers[index];

  if (selectedPlayers.includes(player)) {
    alert("一局必須剛好選擇 4 位玩家！如要更換，請直接點擊其他未選中的玩家來替換。");
    return;
  }

  delete playerStates[selectedPlayers.shift()];
  selectedPlayers.push(player);
  playerStates[player] = { type: "win", score: "" };

  renderEntry();
};

window.updateScore = (index, value) => {
  if (!pending.has("add")) {
    playerStates[selectedPlayers[index]].score = value;
  }
};

window.toggleType = index => {
  if (pending.has("add")) return;

  const state = playerStates[selectedPlayers[index]];
  state.type = state.type === "win" ? "lose" : "win";

  renderEntry();
};

function readScores(names, states) {
  const details = {};
  let sum = 0;
  let scale = 0;

  for (const player of names) {
    const state = states[player];
    const amount = Number(state.score);

    if (
      String(state.score).trim() === "" ||
      !Number.isFinite(amount) ||
      amount < 0
    ) {
      throw Error(`請為「${player}」輸入有效的積分！`);
    }

    details[player] = state.type === "win" ? amount : -amount;
    sum += details[player];
    scale += amount;
  }

  if (Math.abs(sum) > Number.EPSILON * Math.max(1, scale) * 8) {
    throw Error(`積分總和不為 0（目前為 ${sum}），請重新檢查！`);
  }

  return details;
}

function emptyResults() {
  return {
    donation3: 0,
    donation4: 0,
    donation3Type: "",
    donation4Type: "",
    parasite3Name: "",
    parasite3Donation: 0,
    parasite3Type: "",
    parasite4Name: "",
    parasite4Donation: 0,
    parasite4Type: ""
  };
}

window.addRecord = () => busy(
  "add",
  $("addButton"),
  async () => {
    const date = $("gameDate").value;

    if (!date) throw Error("請選擇打牌日期！");

    const details = readScores(selectedPlayers, playerStates);
    const now = new Date();

    await addDoc(collection(db, RECORDS), {
      date,
      time: `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`,
      details,
      ...emptyResults(),
      timestamp: Date.now()
    });

    selectedPlayers.forEach(player => {
      playerStates[player].score = "";
    });

    renderEntry();
    alert("儲存成功！");
  },
  $("entryCard")
);

function updateTotal() {
  $("grandTotalAmount").textContent = `$${donationTotal}`;
  $("grandTotalDetail").textContent = "包含一般捐款與寄生捐款";
}

function ranking(container, values, mode, counts) {
  const sorted = [...allPlayers].sort((a, b) => values[b] - values[a]);
  const medals = ["👑", "🥈", "🥉", "4️⃣", "5️⃣", "6️⃣", "7️⃣", "8️⃣"];

  $(container).innerHTML = '<ul class="rank-list">' + sorted.map(
    (player, index) => {
      const amount = values[player];

      const value =
        mode === "money" ? `$${amount}` :
        mode === "wash" ? `🍽️ ${amount} 次` :
        mode === "avg" ? `${amount > 0 ? "+" : ""}${amount.toFixed(1)}` :
        signed(amount);

      return `
        <li class="rank-item ${index === 0 && amount > 0 && mode !== "money" ? "top-1" : ""}">
          <span>
            ${mode === "money" ? "🎁" : `${medals[index]} 第 ${index + 1} 名：`}
            ${esc(player)}
            ${counts ? `<small class="note">(共 ${counts[player]} 場)</small>` : ""}
          </span>

          <span class="${mode === "score" || mode === "avg" ? color(amount) : ""}">
            ${value}
          </span>
        </li>
      `;
    }
  ).join("") + "</ul>";
}

function donationRanking(donations, counts) {
  const played = allPlayers
    .filter(player => counts[player] > 0)
    .sort(
      (a, b) =>
        donations[a] / counts[a] -
        donations[b] / counts[b]
    );

  const unplayed = allPlayers.filter(player => !counts[player]);

  const fmt = number => Number(number).toLocaleString(
    "zh-TW",
    { maximumFractionDigits: 2 }
  );

  $("avgDonationRankContainer").innerHTML =
    '<ul class="rank-list">' +
    [...played, ...unplayed].map((player, index) => {
      const hasGames = counts[player] > 0;

      return `
        <li class="rank-item ${hasGames && index === 0 ? "top-1" : ""}">
          <span>
            ${hasGames ? `第 ${index + 1} 名：` : "未參與："}
            ${esc(player)}
            <br>
            <small class="note">
              共 ${counts[player]} 將・總捐款 $${fmt(donations[player])}
            </small>
          </span>

          <span style="text-align:right;">
            ${hasGames
              ? `平均一將捐<br><strong>${fmt(donations[player] / counts[player])} 元</strong>`
              : "—"}
          </span>
        </li>
      `;
    }).join("") +
    "</ul>";
}

function choice(type, amount) {
  return type === "wash" ? "wash" :
    type === "money" ? String(amount ?? 0) :
    [50, 100].includes(Number(amount)) ? String(amount) : "";
}

function options(value) {
  return [
    ["", "請選擇"],
    ["0", "0"],
    ["50", "50"],
    ["100", "100"],
    ["wash", "洗碗"]
  ].map(([optionValue, text]) => `
    <option
      value="${optionValue}"
      ${optionValue === "" ? "disabled" : ""}
      ${optionValue === value ? "selected" : ""}
    >
      ${text}
    </option>
  `).join("");
}

function resultInputs(record) {
  const order = rank(record.details);

  const candidates = allPlayers.filter(
    player => !(player in record.details)
  );

  const persons = [3, 4].map(k => `
    <div class="donation-person">
      <strong>${esc(order[k - 1])}（${k}名）：</strong>

      <select id="don${k}_${record.id}" aria-label="第${k}名捐款">
        ${options(choice(
          record[`donation${k}Type`],
          record[`donation${k}`]
        ))}
      </select>
    </div>
  `).join("");

  const parasites = [3, 4].map(k => `
    <div class="parasite-row">
      <strong>寄生 ${esc(order[k - 1])}（${k}名）：</strong>

      <select
        id="par${k}_${record.id}"
        aria-label="寄生第${k}名玩家"
        onchange="toggleParasiteDonation('${record.id}',${k})"
      >
        <option value="">不寄生</option>

        ${candidates.map(player => `
          <option
            ${player === record[`parasite${k}Name`] ? "selected" : ""}
            value="${esc(player)}"
          >
            ${esc(player)}
          </option>
        `).join("")}
      </select>

      <div
        class="parasite-donation-wrap"
        id="wrap${k}_${record.id}"
        style="display:${record[`parasite${k}Name`] ? "flex" : "none"}"
      >
        <span>寄生人捐款：</span>

        <select id="pamt${k}_${record.id}" aria-label="寄生人捐款">
          ${options(choice(
            record[`parasite${k}Type`],
            record[`parasite${k}Donation`]
          ))}
        </select>
      </div>
    </div>
  `).join("");

  return persons + `
    <div class="parasite-section">
      <strong>🪱 寄生</strong>
      ${parasites}
    </div>
  `;
}

// 將每位玩家的每將積分分別視為一筆紀錄。
function gameScoreExtremes(allRecords) {
  const entries = [];
  const dateCounts = {};

  for (const record of allRecords) {
    const date = record.date || "未分類日期";
    const gameNumber = (dateCounts[date] || 0) + 1;

    dateCounts[date] = gameNumber;

    for (const [name, raw] of Object.entries(record.details || {})) {
      const score = Number(raw);

      if (!Number.isFinite(score)) continue;

      entries.push({
        name,
        score,
        date,
        time: record.time || "",
        gameNumber
      });
    }
  }

  return {
    highest: [...entries]
      .sort((a, b) => b.score - a.score)
      .slice(0, 3),

    lowest: [...entries]
      .sort((a, b) => a.score - b.score)
      .slice(0, 3)
  };
}

function renderGameScoreExtremes(allRecords) {
  const extremes = gameScoreExtremes(allRecords);

  for (const [id, list] of [
    ["topGameScoreContainer", extremes.highest],
    ["bottomGameScoreContainer", extremes.lowest]
  ]) {
    $(id).innerHTML = list.length
      ? '<ul class="rank-list">' + list.map((entry, index) => `
          <li class="rank-item ${index === 0 ? "top-1" : ""}">
            <span>
              第 ${index + 1} 筆：${esc(entry.name)}
              <br>
              <small class="note">
                ${esc(entry.date)} ${esc(entry.time)}・第 ${entry.gameNumber} 將
              </small>
            </span>

            <span class="${color(entry.score)}">
              ${signed(entry.score)} 分
            </span>
          </li>
        `).join("") + "</ul>"
      : '<p class="empty">尚無打牌紀錄</p>';
  }
}

function renderDashboard() {
  renderGameScoreExtremes(records);

  const scores = zeros();
  const counts = zeros();
  const donations = zeros();
  const wash = zeros();

  for (const record of records) {
    for (const [player, amount] of Object.entries(record.details)) {
      if (player in scores) {
        scores[player] += Number(amount);
        counts[player]++;
      }
    }

    const order = rank(record.details);

    for (const k of [3, 4]) {
      const player = order[k - 1];
      const guest = record[`parasite${k}Name`];

      if (player in donations) {
        if (record[`donation${k}Type`] === "wash") {
          wash[player]++;
        } else {
          donations[player] += Number(record[`donation${k}`] || 0);
        }
      }

      if (guest in donations) {
        if (record[`parasite${k}Type`] === "wash") {
          wash[guest]++;
        } else {
          donations[guest] += Number(record[`parasite${k}Donation`] || 0);
        }
      }
    }
  }

  donationTotal = Object.values(donations).reduce((a, b) => a + b, 0);
  updateTotal();

  $("totalGameCount").textContent = `${records.length} 將`;

  ranking("rankContainer", scores, "score");

  ranking(
    "avgRankContainer",
    Object.fromEntries(
      allPlayers.map(player => [
        player,
        counts[player] ? scores[player] / counts[player] : 0
      ])
    ),
    "avg",
    counts
  );

  ranking("donationSummaryContainer", donations, "money");
  ranking("washRankContainer", wash, "wash");
  donationRanking(donations, counts);

  const groups = {};

  records.forEach(record => {
    (groups[record.date || "未分類日期"] ??= []).push(record);
  });

  $("recordList").innerHTML = Object.keys(groups).sort().reverse().map(date => `
    <div class="date-group">
      <div class="date-header">📅 記錄日期：${esc(date)}</div>

      ${groups[date].map((record, index) => ({
        record,
        index
      })).reverse().map(({ record, index }) => `
        <div class="record">
          <div class="record-main">
            <strong>第 ${index + 1} 將</strong>
            <span class="record-time">${esc(record.time)}</span>
          </div>

          <div class="scores">
            ${Object.entries(record.details).map(([player, amount]) => `
              <span class="${color(amount)}">
                ${esc(player)} ${signed(amount)}
              </span>
            `).join("")}
          </div>

          <div class="game-donation-inputs">
            ${resultInputs(record)}

            <div class="record-action-row">
              <button
                class="small-confirm-btn"
                id="donButton_${record.id}"
                onclick="saveDonation('${record.id}')"
              >
                確認
              </button>

              <button
                class="small-edit-btn"
                onclick="editRecord('${record.id}')"
              >
                修改積分
              </button>

              <button
                class="small-delete-btn"
                onclick="deleteRecord('${record.id}')"
              >
                刪除此筆
              </button>
            </div>
          </div>
        </div>
      `).join("")}
    </div>
  `).join("") || '<p class="empty">尚無打牌紀錄</p>';

  for (const record of records) {
    for (const k of [3, 4]) {
      window.toggleParasiteDonation(record.id, k);
    }

    if (pending.has(`don:${record.id}`)) {
      $("donButton_" + record.id).disabled = true;
    }
  }
}

window.toggleParasiteDonation = (id, k) => {
  const active = $("par" + k + "_" + id).value !== "";

  $("wrap" + k + "_" + id).style.display =
    active ? "flex" : "none";

  if (!active) {
    $("pamt" + k + "_" + id).value = "";
  }
};

window.saveDonation = id => busy(
  `don:${id}`,
  $("donButton_" + id),
  async () => {
    const record = records.find(record => record.id === id);

    if (!record) throw Error("這筆牌局已不存在。");

    const expected = signature(record.details);
    const data = {};

    for (const k of [3, 4]) {
      const value = $("don" + k + "_" + id).value;
      const guest = $("par" + k + "_" + id).value;
      const parasiteValue = $("pamt" + k + "_" + id).value;

      if (!value) {
        throw Error("請選擇第三名與第四名的結果！");
      }

      if (guest && !parasiteValue) {
        throw Error("請選擇寄生人的捐款結果！");
      }

      data[`donation${k}`] =
        value === "wash" ? 0 : Number(value);

      data[`donation${k}Type`] =
        value === "wash" ? "wash" : "money";

      data[`parasite${k}Name`] = guest;

      data[`parasite${k}Donation`] =
        guest && parasiteValue !== "wash"
          ? Number(parasiteValue)
          : 0;

      data[`parasite${k}Type`] =
        guest
          ? (parasiteValue === "wash" ? "wash" : "money")
          : "";
    }

    await runTransaction(db, async transaction => {
      const reference = doc(db, RECORDS, id);
      const snapshot = await transaction.get(reference);

      if (!snapshot.exists()) {
        throw Error("這筆牌局已被刪除。");
      }

      if (signature(snapshot.data().details) !== expected) {
        throw Error("這筆積分已被修改，請重新確認捐款對象。");
      }

      transaction.update(reference, data);
    });

    alert("結果已儲存！");
  }
);

window.deleteRecord = id => busy(
  `delete:${id}`,
  null,
  async () => {
    if (!admin()) return;

    if (!confirm("確定刪除此筆牌局？積分、捐款、寄生與洗碗紀錄將一起刪除，無法復原。")) {
      return;
    }

    await deleteDoc(doc(db, RECORDS, id));
    alert("此筆資料已刪除！");
  }
);

window.editRecord = id => {
  if (pending.has("edit")) return;

  const record = records.find(record => record.id === id);

  if (!record || !admin()) return;

  const names = Object.keys(record.details);

  editState = {
    id,
    names,
    original: { ...record.details },

    states: Object.fromEntries(names.map(player => [
      player,
      {
        type: record.details[player] < 0 ? "lose" : "win",
        score: String(Math.abs(record.details[player]))
      }
    ]))
  };

  $("editInfo").textContent =
    `${record.date} ${record.time || ""}｜修改原紀錄，不增加將數`;

  $("editMessage").textContent = "";

  renderEditor();
  $("editDialog").showModal();
};

function renderEditor() {
  $("editInputs").innerHTML =
    inputRows(editState.names, editState.states, true);
}

window.updateEditScore = (index, value) => {
  if (editState && !pending.has("edit")) {
    editState.states[editState.names[index]].score = value;
  }
};

window.toggleEditType = index => {
  if (!editState || pending.has("edit")) return;

  const state = editState.states[editState.names[index]];
  state.type = state.type === "win" ? "lose" : "win";

  renderEditor();
};

window.closeEditor = () => {
  if (pending.has("edit")) return;

  $("editDialog").close();
  editState = null;
};

$("editDialog").addEventListener("cancel", event => {
  if (pending.has("edit")) {
    event.preventDefault();
  } else {
    editState = null;
  }
});

window.saveEdit = () => busy(
  "edit",
  $("editSaveButton"),
  async () => {
    if (!editState) return;

    const state = editState;
    let details;

    try {
      details = readScores(state.names, state.states);
    } catch (error) {
      $("editMessage").textContent = error.message;
      return;
    }

    const before = rank(state.original);
    const after = rank(details);

    const changed = [3, 4].filter(
      k => before[k - 1] !== after[k - 1]
    );

    if (
      changed.length &&
      !confirm(
        `第 ${changed.join("、")} 名的玩家已改變。\n` +
        "這些名次的捐款、洗碗及寄生資料會清除，請重新選擇並確認。\n" +
        "確定儲存修改？"
      )
    ) {
      return;
    }

    const patch = { details };

    for (const k of changed) {
      patch[`donation${k}`] = 0;
      patch[`donation${k}Type`] = "";
      patch[`parasite${k}Name`] = "";
      patch[`parasite${k}Donation`] = 0;
      patch[`parasite${k}Type`] = "";
    }

    try {
      await runTransaction(db, async transaction => {
        const reference = doc(db, RECORDS, state.id);
        const snapshot = await transaction.get(reference);

        if (!snapshot.exists()) {
          throw Error("這筆牌局已被刪除，無法修改。");
        }

        if (
          signature(snapshot.data().details) !== signature(state.original)
        ) {
          throw Error("其他裝置已修改這筆積分。請取消並重新開啟編輯。");
        }

        transaction.update(reference, patch);
      });

      for (const k of changed) {
        for (const prefix of ["don", "par", "pamt"]) {
          const element = $(prefix + k + "_" + state.id);
          if (element) element.value = "";
        }

        window.toggleParasiteDonation(state.id, k);
      }

      $("editDialog").close();
      editState = null;

      alert(
        changed.length
          ? "積分已更新！請重新確認換人名次的捐款與寄生結果。"
          : "積分已更新！"
      );
    } catch (error) {
      console.error(error);

      $("editMessage").textContent =
        error.message || "修改失敗，請檢查網路後重試。";
    }
  },
  $("editDialog")
);

$("gameDate").value = new Date().toISOString().split("T")[0];

renderEntry();
renderDashboard();

onSnapshot(
  query(collection(db, RECORDS), orderBy("timestamp", "asc")),
  snapshot => {
    records = snapshot.docs.map(document => ({
      ...document.data(),
      id: document.id
    }));

    renderDashboard();
  },
  error => {
    console.error(error);

    $("recordList").textContent =
      "牌局載入失敗，請檢查網路與資料庫權限。";
  }
);
</script>
</body>
</html>
