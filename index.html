<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻將雲端記帳本</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        h2, h3 {
            text-align: center;
            color: #2c3e50;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* 8選4 玩家選擇 */
        .player-select-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 5px;
        }

        .select-player-btn {
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            background-color: #ecf0f1;
            color: #2c3e50;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-player-btn.active {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }

        /* 玩家積分輸入 */
        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .input-row span {
            font-weight: bold;
            min-width: 50px;
        }

        /* 贏輸按鈕 */
        .type-toggle-btn {
            width: 45px;
            height: 42px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            cursor: pointer;
            background-color: #ecf0f1;
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0;
        }

        .type-toggle-btn.win {
            background-color: #27ae60;
            color: white;
            border-color: #1e8449;
        }

        .type-toggle-btn.lose {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

        .action-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        .action-btn:hover {
            background-color: #1a252f;
        }

        /* 排行榜 */
        .rank-list {
            list-style-type: none;
            padding: 0;
            margin-top: 10px;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: #fdfefe;
            border: 1px solid #d6dbdf;
            border-radius: 6px;
            font-weight: bold;
        }

        .rank-item.top-1 {
            background: #fcf3cf;
            border-color: #f7dc6f;
        }

        /* 歷史紀錄 */
        .history-container {
            max-height: 350px;
            overflow-y: auto;
        }

        .date-group {
            margin-bottom: 15px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
        }

        .date-header {
            background: #edf2f7;
            padding: 8px 12px;
            font-weight: bold;
            color: #2d3748;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        ul.date-records {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        ul.date-records li {
            padding: 10px 12px;
            border-bottom: 1px solid #edf2f7;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        ul.date-records li:last-child {
            border-bottom: none;
        }

        ul.date-records li .record-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-time {
            font-size: 12px;
            color: #a0aec0;
        }

        /* 每局捐款區塊 */
        .game-donation-inputs {
            display: flex;
            gap: 10px;
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px dashed #cbd5e0;
            font-size: 13px;
            align-items: center;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .donation-person {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .game-donation-inputs select {
            padding: 5px 8px;
            font-size: 13px;
            width: 105px;
            background: white;
        }

        /* 確認按鈕 */
        .small-confirm-btn {
            padding: 5px 14px;
            font-size: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
            font-weight: bold;
        }

        .small-confirm-btn:hover {
            background-color: #1e8449;
        }

        /* 單筆刪除按鈕 */
        .small-delete-btn {
            padding: 5px 10px;
            font-size: 12px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
        }

        .small-delete-btn:hover {
            background-color: #c0392b;
        }
    </style>

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            setDoc,
            deleteDoc,
            doc,
            onSnapshot,
            query,
            orderBy
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        const firebaseConfig = {
            apiKey: "AIzaSyDS9-ray-dSj_Y7IvrRjofEIWHjqFgu0Zg",
            authDomain: "mahjong-a2377.firebaseapp.com",
            projectId: "mahjong-a2377",
            storageBucket: "mahjong-a2377.firebasestorage.app",
            messagingSenderId: "892513192079",
            appId: "1:892513192079:web:ce033c110932cfbfc508fa",
            measurementId: "G-707G2B2DH3"
        };


        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);


        /* ===============================
           玩家名單
        =============================== */

        const allPlayers = [
            "大凸",
            "阿翔",
            "大姐",
            "鱷魚",
            "抖內姐",
            "黑人",
            "藍莓",
            "阿雯"
        ];


        let selectedPlayers = [
            "大凸",
            "阿翔",
            "大姐",
            "鱷魚"
        ];


        let playerStates = {
            "大凸": {
                type: "win",
                score: ""
            },

            "阿翔": {
                type: "win",
                score: ""
            },

            "大姐": {
                type: "win",
                score: ""
            },

            "鱷魚": {
                type: "win",
                score: ""
            }
        };


        /* ===============================
           網頁載入
        =============================== */

        window.onload = function() {

            const today = new Date()
                .toISOString()
                .split("T")[0];

            document.getElementById("gameDate").value = today;

            renderSelector();
            renderInputs();
        };


        /* ===============================
           選擇玩家
        =============================== */

        window.togglePlayer = function(name) {

            selectedPlayers.forEach(p => {

                const inputEl =
                    document.getElementById(`amt_${p}`);

                if (
                    inputEl &&
                    playerStates[p]
                ) {
                    playerStates[p].score =
                        inputEl.value;
                }

            });


            const index =
                selectedPlayers.indexOf(name);


            if (index > -1) {

                alert(
                    "一局必須剛好選擇 4 位玩家！如要更換，請直接點擊其他未選中的玩家來替換。"
                );

                return;
            }


            if (selectedPlayers.length >= 4) {

                const removedPlayer =
                    selectedPlayers.shift();

                delete playerStates[
                    removedPlayer
                ];
            }


            selectedPlayers.push(name);

            playerStates[name] = {
                type: "win",
                score: ""
            };


            renderSelector();
            renderInputs();
        };


        /* ===============================
           顯示玩家選擇按鈕
        =============================== */

        function renderSelector() {

            const container =
                document.getElementById(
                    "playerSelectorContainer"
                );

            let html = "";


            allPlayers.forEach(p => {

                const isActive =
                    selectedPlayers.includes(p)
                        ? "active"
                        : "";

                html += `
                    <button
                        type="button"
                        class="select-player-btn ${isActive}"
                        onclick="togglePlayer('${p}')"
                    >
                        ${p}
                    </button>
                `;
            });


            container.innerHTML = html;
        }


        /* ===============================
           切換贏 / 輸
        =============================== */

        window.toggleType = function(name) {

            const inputEl =
                document.getElementById(
                    `amt_${name}`
                );


            if (inputEl) {
                playerStates[name].score =
                    inputEl.value;
            }


            if (
                playerStates[name].type === "win"
            ) {

                playerStates[name].type =
                    "lose";

            } else {

                playerStates[name].type =
                    "win";
            }


            renderInputs();
        };


        /* ===============================
           顯示四位玩家積分輸入
        =============================== */

        function renderInputs() {

            const container =
                document.getElementById(
                    "fourInputsContainer"
                );

            let html = "";


            selectedPlayers.forEach(name => {

                const state =
                    playerStates[name];

                const typeClass =
                    state.type === "win"
                        ? "win"
                        : "lose";

                const typeText =
                    state.type === "win"
                        ? "贏"
                        : "輸";

                const currentVal =
                    state.score !== undefined
                        ? state.score
                        : "";


                html += `
                    <div class="input-row">

                        <span>
                            ${name}
                        </span>

                        <button
                            type="button"
                            class="type-toggle-btn ${typeClass}"
                            onclick="toggleType('${name}')"
                        >
                            ${typeText}
                        </button>

                        <input
                            type="number"
                            id="amt_${name}"
                            placeholder="輸入積分"
                            value="${currentVal}"
                            min="0"
                            oninput="updateScore('${name}', this.value)"
                            style="flex:1;"
                        >

                    </div>
                `;
            });


            container.innerHTML = html;
        }


        /* ===============================
           更新積分
        =============================== */

        window.updateScore = function(name, val) {

            if (playerStates[name]) {
                playerStates[name].score = val;
            }
        };


        /* ===============================
           新增一局紀錄
        =============================== */

        window.addRecord =
        async function() {

            const dateVal =
                document.getElementById(
                    "gameDate"
                ).value;


            if (!dateVal) {

                alert(
                    "請選擇打牌日期！"
                );

                return;
            }


            let totalSum = 0;
            let recordDetails = {};


            for (
                let name
                of selectedPlayers
            ) {

                const amtVal =
                    document.getElementById(
                        `amt_${name}`
                    ).value;

                const num =
                    parseFloat(amtVal);


                if (
                    isNaN(num) ||
                    num < 0
                ) {

                    alert(
                        `請為「${name}」輸入有效的積分！`
                    );

                    return;
                }


                const signedAmount =
                    playerStates[name].type
                    === "win"
                        ? num
                        : -num;


                totalSum +=
                    signedAmount;

                recordDetails[name] =
                    signedAmount;
            }


            if (totalSum !== 0) {

                alert(
`⚠️ 積分總和不為 0（目前計算總和為：${totalSum}）！

麻將積分總和必須剛好平衡
（贏的總積分要等於輸的總積分）

請重新檢查並輸入！`
                );

                return;
            }


            const now =
                new Date();

            const timeStr =
                `${String(
                    now.getHours()
                ).padStart(2, "0")}:${String(
                    now.getMinutes()
                ).padStart(2, "0")}`;


            try {

                await addDoc(
                    collection(
                        db,
                        "mahjong_records_v7"
                    ),
                    {
                        date:
                            dateVal,

                        time:
                            timeStr,

                        details:
                            recordDetails,

                        donation3:
                            0,

                        donation4:
                            0,

                        donation3Type:
                            "",

                        donation4Type:
                            "",

                        timestamp:
                            Date.now()
                    }
                );


                for (
                    let name
                    in playerStates
                ) {

                    playerStates[name].score =
                        "";
                }


                renderInputs();

                alert(
                    "儲存成功！"
                );

            } catch (e) {

                console.error(
                    "寫入錯誤：",
                    e
                );

                alert(
                    "儲存失敗，請檢查網路連線！"
                );
            }
        };


        /* ===============================
           確認捐款 / 洗碗
           新增與修改皆使用此功能
        =============================== */

        window.saveDonation =
        async function(docId) {

            const select3 =
                document.getElementById(
                    `don3_amt_${docId}`
                );

            const select4 =
                document.getElementById(
                    `don4_amt_${docId}`
                );


            const choice3 =
                select3.value;

            const choice4 =
                select4.value;


            if (
                choice3 === "" ||
                choice4 === ""
            ) {

                alert(
                    "請選擇第三名與第四名的結果！"
                );

                return;
            }


            const amount3 =
                choice3 === "wash"
                    ? 0
                    : Number(choice3);


            const amount4 =
                choice4 === "wash"
                    ? 0
                    : Number(choice4);


            const type3 =
                choice3 === "wash"
                    ? "wash"
                    : "money";


            const type4 =
                choice4 === "wash"
                    ? "wash"
                    : "money";


            try {

                const docRef =
                    doc(
                        db,
                        "mahjong_records_v7",
                        docId
                    );


                await setDoc(
                    docRef,
                    {
                        donation3:
                            amount3,

                        donation4:
                            amount4,

                        donation3Type:
                            type3,

                        donation4Type:
                            type4
                    },
                    {
                        merge: true
                    }
                );


                alert(
                    "結果已儲存！"
                );

            } catch (e) {

                console.error(
                    "結果寫入錯誤：",
                    e
                );

                alert(
                    "儲存失敗！"
                );
            }
        };


        /* ===============================
           刪除單筆牌局紀錄
        =============================== */

        window.deleteRecord =
        async function(docId) {

            const pwd =
                prompt(
                    "請輸入管理者密碼以刪除此筆資料："
                );


            if (pwd === null) {
                return;
            }


            if (pwd !== "0721") {

                alert(
                    "密碼錯誤，無法刪除資料！"
                );

                return;
            }


            const confirmDelete =
                confirm(
`確定要刪除這一筆牌局紀錄嗎？

此筆積分與捐款資料都會一起刪除，而且無法復原！`
                );


            if (!confirmDelete) {
                return;
            }


            try {

                await deleteDoc(
                    doc(
                        db,
                        "mahjong_records_v7",
                        docId
                    )
                );


                alert(
                    "此筆資料已刪除！"
                );

            } catch (e) {

                console.error(
                    "刪除錯誤：",
                    e
                );

                alert(
                    "刪除失敗，請檢查網路連線！"
                );
            }
        };


        /* ===============================
           Firebase 即時監聽
        =============================== */

        let latestRecords = [];


        const qRec =
            query(
                collection(
                    db,
                    "mahjong_records_v7"
                ),
                orderBy(
                    "timestamp",
                    "asc"
                )
            );


        onSnapshot(
            qRec,
            snapshot => {

                latestRecords = [];


                snapshot.forEach(
                    docSnap => {

                        latestRecords.push({
                            id:
                                docSnap.id,

                            ...docSnap.data()
                        });
                    }
                );


                renderDashboard(
                    latestRecords
                );
            }
        );


        /* ===============================
           畫面統計
        =============================== */

        function renderDashboard(records) {

            const listEl =
                document.getElementById(
                    "recordList"
                );

            const rankEl =
                document.getElementById(
                    "rankContainer"
                );

            const avgRankEl =
                document.getElementById(
                    "avgRankContainer"
                );

            const donationSummaryEl =
                document.getElementById(
                    "donationSummaryContainer"
                );

            const washRankEl =
                document.getElementById(
                    "washRankContainer"
                );


            const summaryObj = {};
            const countObj = {};
            const donationObj = {};
            const washObj = {};


            allPlayers.forEach(p => {

                summaryObj[p] = 0;
                countObj[p] = 0;
                donationObj[p] = 0;
                washObj[p] = 0;
            });


            /* ===============================
               計算所有資料
            =============================== */

            records.forEach(r => {

                const details =
                    r.details;


                const sortedThisGame =
                    Object.keys(
                        details
                    ).sort(
                        (a, b) =>
                            details[b]
                            -
                            details[a]
                    );


                const p3 =
                    sortedThisGame[2];

                const p4 =
                    sortedThisGame[3];


                /* 第三名 */

                if (p3) {

                    if (
                        r.donation3Type === "wash"
                    ) {

                        washObj[p3] += 1;

                    } else {

                        donationObj[p3] +=
                            Number(
                                r.donation3 || 0
                            );
                    }
                }


                /* 第四名 */

                if (p4) {

                    if (
                        r.donation4Type === "wash"
                    ) {

                        washObj[p4] += 1;

                    } else {

                        donationObj[p4] +=
                            Number(
                                r.donation4 || 0
                            );
                    }
                }


                /* 積分與場次 */

                for (
                    let name
                    in details
                ) {

                    if (
                        summaryObj[name]
                        !== undefined
                    ) {

                        summaryObj[name] +=
                            details[name];

                        countObj[name] +=
                            1;
                    }
                }
            });


            /* ===============================
               總積分排行榜
            =============================== */

            const sortedPlayers =
                Object.keys(
                    summaryObj
                ).sort(
                    (a, b) =>
                        summaryObj[b]
                        -
                        summaryObj[a]
                );


            const medals = [
                "👑",
                "🥈",
                "🥉",
                "4️⃣",
                "5️⃣",
                "6️⃣",
                "7️⃣",
                "8️⃣"
            ];


            let rankHTML =
                '<ul class="rank-list">';


            sortedPlayers.forEach(
                (name, index) => {

                    const total =
                        summaryObj[name];


                    const color =
                        total > 0
                            ? "color:#27ae60;"
                            : total < 0
                                ? "color:#e74c3c;"
                                : "color:#7f8c8d;";


                    const sign =
                        total > 0
                            ? "+"
                            : "";


                    const rankClass =
                        index === 0 &&
                        total > 0
                            ? "top-1"
                            : "";


                    rankHTML += `
                        <li class="rank-item ${rankClass}">

                            <span>
                                ${medals[index]}
                                第 ${index + 1} 名：
                                ${name}
                            </span>

                            <span style="${color}">
                                ${sign}${total}
                            </span>

                        </li>
                    `;
                }
            );


            rankHTML += "</ul>";

            rankEl.innerHTML =
                rankHTML;


            /* ===============================
               平均分排行榜
            =============================== */

            const sortedByAvg =
                Object.keys(
                    summaryObj
                ).sort(
                    (a, b) => {

                        const avgA =
                            countObj[a] > 0
                                ? summaryObj[a] /
                                  countObj[a]
                                : 0;


                        const avgB =
                            countObj[b] > 0
                                ? summaryObj[b] /
                                  countObj[b]
                                : 0;


                        return avgB - avgA;
                    }
                );


            let avgRankHTML =
                '<ul class="rank-list">';


            sortedByAvg.forEach(
                (name, index) => {

                    const count =
                        countObj[name];


                    const avg =
                        count > 0
                            ? (
                                summaryObj[name] /
                                count
                              ).toFixed(1)
                            : "0.0";


                    const numAvg =
                        parseFloat(avg);


                    const color =
                        numAvg > 0
                            ? "color:#27ae60;"
                            : numAvg < 0
                                ? "color:#e74c3c;"
                                : "color:#7f8c8d;";


                    const sign =
                        numAvg > 0
                            ? "+"
                            : "";


                    const rankClass =
                        index === 0 &&
                        numAvg > 0
                            ? "top-1"
                            : "";


                    avgRankHTML += `
                        <li class="rank-item ${rankClass}">

                            <span>

                                ${medals[index]}
                                第 ${index + 1} 名：
                                ${name}

                                <span
                                    style="
                                        font-size:12px;
                                        color:#888;
                                    "
                                >
                                    (共 ${count} 場)
                                </span>

                            </span>

                            <span style="${color}">
                                ${sign}${avg}
                            </span>

                        </li>
                    `;
                }
            );


            avgRankHTML += "</ul>";

            avgRankEl.innerHTML =
                avgRankHTML;


            /* ===============================
               歷史紀錄
            =============================== */

            if (records.length === 0) {

                listEl.innerHTML = `
                    <p
                        style="
                            color:#7f8c8d;
                            text-align:center;
                        "
                    >
                        尚無打牌紀錄
                    </p>
                `;

            } else {

                const groupedByDate = {};


                records.forEach(r => {

                    const d =
                        r.date ||
                        "未分類日期";


                    if (
                        !groupedByDate[d]
                    ) {

                        groupedByDate[d] =
                            [];
                    }


                    groupedByDate[d].push(r);
                });


                const sortedDates =
                    Object.keys(
                        groupedByDate
                    ).sort(
                        (a, b) =>
                            new Date(b)
                            -
                            new Date(a)
                    );


                let historyHTML = "";


                sortedDates.forEach(
                    dateStr => {

                        const dayRecords =
                            groupedByDate[
                                dateStr
                            ];


                        historyHTML += `
                            <div class="date-group">

                                <div class="date-header">
                                    📅 記錄日期：${dateStr}
                                </div>

                                <ul class="date-records">
                        `;


                        for (
                            let i =
                                dayRecords.length - 1;
                            i >= 0;
                            i--
                        ) {

                            const r =
                                dayRecords[i];


                            const gameIndex =
                                i + 1;


                            const gameTitle =
                                `第 ${gameIndex} 將`;


                            const detailStrs =
                                [];


                            const sortedThisGame =
                                Object.keys(
                                    r.details
                                ).sort(
                                    (a, b) =>
                                        r.details[b]
                                        -
                                        r.details[a]
                                );


                            const p3 =
                                sortedThisGame[2]
                                || "第三名";


                            const p4 =
                                sortedThisGame[3]
                                || "第四名";


                            for (
                                let name
                                in r.details
                            ) {

                                const amt =
                                    r.details[name];


                                const color =
                                    amt >= 0
                                        ? "color:#27ae60;"
                                        : "color:#e74c3c;";


                                const sign =
                                    amt >= 0
                                        ? "+"
                                        : "";


                                detailStrs.push(
                                    `<span style="${color}">
                                        ${name} ${sign}${amt}
                                    </span>`
                                );
                            }


                            /* 第三名目前選項 */

                            let selected3_50 = "";
                            let selected3_100 = "";
                            let selected3_wash = "";
                            let selected3_none = "";


                            if (
                                r.donation3Type === "wash"
                            ) {

                                selected3_wash =
                                    "selected";

                            } else if (
                                Number(r.donation3) === 50
                            ) {

                                selected3_50 =
                                    "selected";

                            } else if (
                                Number(r.donation3) === 100
                            ) {

                                selected3_100 =
                                    "selected";

                            } else {

                                selected3_none =
                                    "selected";
                            }


                            /* 第四名目前選項 */

                            let selected4_50 = "";
                            let selected4_100 = "";
                            let selected4_wash = "";
                            let selected4_none = "";


                            if (
                                r.donation4Type === "wash"
                            ) {

                                selected4_wash =
                                    "selected";

                            } else if (
                                Number(r.donation4) === 50
                            ) {

                                selected4_50 =
                                    "selected";

                            } else if (
                                Number(r.donation4) === 100
                            ) {

                                selected4_100 =
                                    "selected";

                            } else {

                                selected4_none =
                                    "selected";
                            }


                            historyHTML += `
                                <li>

                                    <div class="record-main">

                                        <div>

                                            <strong
                                                style="
                                                    color:#4a5568;
                                                    margin-right:8px;
                                                "
                                            >
                                                [${gameTitle}]
                                            </strong>

                                            <span
                                                style="
                                                    display:inline-flex;
                                                    gap:10px;
                                                    flex-wrap:wrap;
                                                "
                                            >
                                                ${detailStrs.join(" | ")}
                                            </span>

                                        </div>

                                        <div class="record-time">
                                            ${r.time || ""}
                                        </div>

                                    </div>


                                    <div class="game-donation-inputs">


                                        <div class="donation-person">

                                            💡

                                            <strong>
                                                ${p3}
                                            </strong>

                                            (3名)：

                                            <select
                                                id="don3_amt_${r.id}"
                                            >

                                                <option
                                                    value=""
                                                    disabled
                                                    ${selected3_none}
                                                >
                                                    請選擇
                                                </option>

                                                <option
                                                    value="50"
                                                    ${selected3_50}
                                                >
                                                    50
                                                </option>

                                                <option
                                                    value="100"
                                                    ${selected3_100}
                                                >
                                                    100
                                                </option>

                                                <option
                                                    value="wash"
                                                    ${selected3_wash}
                                                >
                                                    洗碗
                                                </option>

                                            </select>

                                        </div>


                                        <div class="donation-person">

                                            💡

                                            <strong>
                                                ${p4}
                                            </strong>

                                            (4名)：

                                            <select
                                                id="don4_amt_${r.id}"
                                            >

                                                <option
                                                    value=""
                                                    disabled
                                                    ${selected4_none}
                                                >
                                                    請選擇
                                                </option>

                                                <option
                                                    value="50"
                                                    ${selected4_50}
                                                >
                                                    50
                                                </option>

                                                <option
                                                    value="100"
                                                    ${selected4_100}
                                                >
                                                    100
                                                </option>

                                                <option
                                                    value="wash"
                                                    ${selected4_wash}
                                                >
                                                    洗碗
                                                </option>

                                            </select>

                                        </div>


                                        <button
                                            type="button"
                                            class="small-confirm-btn"
                                            onclick="saveDonation('${r.id}')"
                                        >
                                            確認
                                        </button>


                                        <button
                                            type="button"
                                            class="small-delete-btn"
                                            onclick="deleteRecord('${r.id}')"
                                        >
                                            刪除此筆
                                        </button>

                                    </div>

                                </li>
                            `;
                        }


                        historyHTML += `
                                </ul>
                            </div>
                        `;
                    }
                );


                listEl.innerHTML =
                    historyHTML;
            }


            /* ===============================
               捐款總計
            =============================== */

            let donationHTML =
                '<ul class="rank-list">';


            const sortedDonationPlayers =
                Object.keys(
                    donationObj
                ).sort(
                    (a, b) =>
                        donationObj[b]
                        -
                        donationObj[a]
                );


            sortedDonationPlayers.forEach(
                name => {

                    const totalDonation =
                        donationObj[name];


                    donationHTML += `
                        <li class="rank-item">

                            <span>
                                🎁 ${name}
                            </span>

                            <span
                                style="
                                    color:#d35400;
                                "
                            >
                                $${totalDonation}
                            </span>

                        </li>
                    `;
                }
            );


            donationHTML += "</ul>";

            donationSummaryEl.innerHTML =
                donationHTML;


            /* ===============================
               洗碗排行榜
            =============================== */

            const sortedWashPlayers =
                Object.keys(
                    washObj
                ).sort(
                    (a, b) => {

                        if (
                            washObj[b] !==
                            washObj[a]
                        ) {

                            return (
                                washObj[b] -
                                washObj[a]
                            );
                        }


                        return (
                            allPlayers.indexOf(a) -
                            allPlayers.indexOf(b)
                        );
                    }
                );


            let washHTML =
                '<ul class="rank-list">';


            sortedWashPlayers.forEach(
                (name, index) => {

                    const washCount =
                        washObj[name];


                    const rankClass =
                        index === 0 &&
                        washCount > 0
                            ? "top-1"
                            : "";


                    washHTML += `
                        <li class="rank-item ${rankClass}">

                            <span>
                                ${medals[index]}
                                第 ${index + 1} 名：
                                ${name}
                            </span>

                            <span
                                style="
                                    color:#2980b9;
                                "
                            >
                                🍽️ ${washCount} 次
                            </span>

                        </li>
                    `;
                }
            );


            washHTML += "</ul>";

            washRankEl.innerHTML =
                washHTML;
        }

    </script>
</head>

<body>

    <h2>
        🀄 麻將雲端記帳本
    </h2>


    <!-- 選擇日期與玩家 -->

    <div class="card">

        <h3>
            1. 選擇打牌日期與 4 位玩家
        </h3>


        <div class="form-group">

            <label for="gameDate">
                選擇日期：
            </label>

            <input
                type="date"
                id="gameDate"
            >

        </div>


        <div
            class="form-group"
            style="margin-top:15px;"
        >

            <label>
                8 選 4：選擇本局 4 位玩家
            </label>

            <p
                style="
                    font-size:12px;
                    color:#666;
                    margin-top:-3px;
                    margin-bottom:8px;
                "
            >
                直接點擊未選中的人，即可自動替換！
            </p>

            <div
                class="player-select-grid"
                id="playerSelectorContainer"
            >
            </div>

        </div>

    </div>


    <!-- 輸入積分 -->

    <div class="card">

        <h3>
            2. 輸入各家積分
        </h3>

        <div id="fourInputsContainer">
        </div>

        <button
            class="action-btn"
            onclick="addRecord()"
        >
            確認無誤並儲存記錄
        </button>

    </div>


    <!-- 總積分排行榜 -->

    <div class="card">

        <h3>
            🏆 總積分排行榜
        </h3>

        <div id="rankContainer">
        </div>

    </div>


    <!-- 平均分排行榜 -->

    <div class="card">

        <h3>
            📈 平均分排行榜（總積分 ÷ 場次）
        </h3>

        <div id="avgRankContainer">
        </div>

    </div>


    <!-- 歷史紀錄 -->

    <div class="card">

        <h3>
            📜 歷史明細（依日期與將次區分）
        </h3>

        <div
            class="history-container"
            id="recordList"
        >

            <p
                style="
                    color:#7f8c8d;
                    text-align:center;
                "
            >
                尚無打牌紀錄
            </p>

        </div>

    </div>


    <!-- 捐款總計 -->

    <div class="card">

        <h3>
            🎁 捐款結果總計
        </h3>

        <div id="donationSummaryContainer">
        </div>

    </div>


    <!-- 洗碗排行榜 -->

    <div class="card">

        <h3>
            🍽️ 洗碗排行榜
        </h3>

        <div id="washRankContainer">
        </div>

    </div>


</body>
</html>
